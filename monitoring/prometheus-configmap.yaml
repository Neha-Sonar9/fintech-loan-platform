apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring

data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      
    alerting:
      alertmanagers:
        - static_configs:
          - targets:
            - "alertmanager.monitoring.svc.cluster.local:9093"
    rule_files:
      - /etc/prometheus/rules/alert-rules.yml

    scrape_configs:

      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: "customer-service"
        metrics_path: /actuator/prometheus

        static_configs:
          - targets:
              - customer-service.fintech-dev.svc.cluster.local:8081