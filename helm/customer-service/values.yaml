replicaCount: 3

image:
  repository: nsonar/customer-service
  tag: 39-c7ce052
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8081
  targetPort: 8081

ingress:
  enabled: true
  className: nginx
  host: fintech.local
  path: /customer-service(/|$)(.*)
  pathType: ImplementationSpecific

strategy:
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 1

probes:
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 40
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3

configMap:
  name: customer-service-config

secret:
  name: customer-service-secret

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: null  

pdb:
  enabled: true
  minAvailable: 1   